name: windows-smoke

# installs the NSIS build silently, then runs the app's self-test mode
# (STEMKIT_SMOKE=1): full bootstrap on a python-less runner + separating a
# generated tone through both engines. Run manually before cutting a release
on:
  workflow_dispatch:
  workflow_call:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx electron-vite build

      - run: npx electron-builder --win --publish never

      - name: Install (NSIS silent)
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "no installer exe found in release/" }
          Write-Host "installer: $($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "StemKit.exe" | Select-Object -First 1
          if (-not $exe) { throw "StemKit.exe not found after install" }
          Write-Host "installed: $($exe.FullName)"
          Add-Content $env:GITHUB_ENV "STEMKIT_EXE=$($exe.FullName)"

      - name: Smoke (bootstrap + both engines)
        shell: pwsh
        run: |
          $env:STEMKIT_SMOKE = '1'
          $p = Start-Process -FilePath $env:STEMKIT_EXE -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Print smoke log
        if: always()
        shell: pwsh
        run: if (Test-Path "$env:TEMP\stemkit-smoke.log") { Get-Content "$env:TEMP\stemkit-smoke.log" }

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: ${{ runner.temp }}/stemkit-smoke.log
          if-no-files-found: ignore
