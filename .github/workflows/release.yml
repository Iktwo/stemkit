name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        id: install
        run: npm ci
        continue-on-error: true

      - name: Install dependencies (fallback)
        if: steps.install.outcome == 'failure'
        run: npm install

      - name: Fetch ffmpeg (mac)
        if: matrix.platform == 'mac'
        run: bash scripts/fetch-ffmpeg.sh

      - name: Fetch ffmpeg (win)
        if: matrix.platform == 'win'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      - name: Build app bundles
        run: npx electron-vite build

      - name: Package (release)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.CSC_MAC_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_MAC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --${{ matrix.platform }} --publish always

      - name: Package (on demand)
        if: github.event_name == 'workflow_dispatch'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.CSC_MAC_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_MAC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: stemkit-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error
